# docker-compose.yml
# Orquesta una plataforma de analítica, automatización y observabilidad para uso local.
version: "3.8"

services:
  # Jupyter para scraping, notebooks y análisis SEO.
  jupyter:
    image: jupyter/minimal-notebook
    container_name: jupyter
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
    command: start-notebook.sh --NotebookApp.token=''
    restart: unless-stopped
    networks: [mynetwork]

  # n8n para automatización de workflows y publicación en redes.
  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    volumes:
      - ./n8n_data:/home/node/.n8n
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
    restart: unless-stopped
    networks: [mynetwork]

  # Metabase para dashboards y análisis BI.
  metabase:
    image: metabase/metabase
    container_name: metabase
    ports:
      - "3000:3000"
    volumes:
      - ./metabase-data:/metabase-data
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
    restart: unless-stopped
    networks: [mynetwork]

  # Grafana para visualización de métricas y alertas.
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "4000:3000"
    volumes:
      - ./grafana-data:/var/lib/grafana
    restart: unless-stopped
    networks: [mynetwork]

  # Prometheus para scraping y almacenamiento de métricas.
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    networks: [mynetwork]

  # Matomo para analítica web self-hosted.
  matomo:
    image: matomo
    container_name: matomo
    ports:
      - "8080:80"
    volumes:
      - ./matomo:/var/www/html
    restart: unless-stopped
    networks: [mynetwork]

  # Dependencias de Plausible (PostgreSQL + ClickHouse).
  plausible-db:
    image: postgres:15
    container_name: plausible-db
    environment:
      - POSTGRES_DB=plausible
      - POSTGRES_USER=plausible
      - POSTGRES_PASSWORD=plausible
    volumes:
      - plausible-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks: [mynetwork]

  plausible-events-db:
    image: clickhouse/clickhouse-server:24.3
    container_name: plausible-events-db
    restart: unless-stopped
    networks: [mynetwork]

  # Plausible Analytics con dependencias completas.
  plausible:
    image: plausible/analytics:v2.1.4
    container_name: plausible
    ports:
      - "8000:8000"
    env_file:
      - ./plausible/plausible-config.env
    depends_on:
      - plausible-db
      - plausible-events-db
    command: sh -c "sleep 10 && /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    restart: unless-stopped
    networks: [mynetwork]

networks:
  mynetwork:
    driver: bridge

volumes:
  plausible-db-data:
